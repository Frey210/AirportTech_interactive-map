server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /maps {
        return 301 /maps/;
    }

    location /maps/ {
        try_files $uri $uri/ /maps/index.html;
    }

    location / {
        return 404;
    }
}
